name: Build Diditok Injection IPA

on:
  workflow_dispatch:
    inputs:
      original_ipa_url:
        description: "原始滴滴 IPA 直链（Run workflow 时填）"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download original IPA
        run: |
          set -euo pipefail
          IPA_URL="${{ inputs.original_ipa_url }}"
          if [ -z "$IPA_URL" ]; then
            IPA_URL="https://github.com/155757677/diditok-build-20261027/releases/download/original-ipa/com.xiaojukeji.didi_8.0.14_und3fined.ipa"
          fi
          curl -L --retry 3 -o original.ipa "$IPA_URL"
          ls -lh original.ipa

      - name: Install Theos + ldid
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/theos/theos.git ~/theos
          brew install ldid

      - name: Build Diditok.dylib
        run: |
          set -euo pipefail
          cd Tweak
          make clean 2>/dev/null || true
          make all THEOS=$HOME/theos
          DYLIB="$(find . -name '*.dylib' | head -1)"
          echo "DYLIB=$DYLIB"
          lipo -info "$DYLIB"

      - name: Collect dylib + LIEF
        run: |
          mkdir -p out
          cp "$(find Tweak -name '*.dylib' | head -1)" out/Diditok.dylib
          ls -la out/
          lipo -info out/Diditok.dylib
          pip3 install lief --break-system-packages 2>/dev/null || pip install lief

      - name: Inject + codesign + repack
        run: |
          set -e
          unzip -q original.ipa -d ipa_extracted
          APP_DIR=$(find ipa_extracted/Payload -name "*.app" -type d | head -1)
          APP_NAME=$(basename "$APP_DIR" .app)
          BIN="$APP_DIR/$APP_NAME"
          echo "App dir: $APP_DIR"
          echo "Binary:  $BIN"
          lipo -info "$BIN"

          mkdir -p "$APP_DIR/Frameworks"
          cp out/Diditok.dylib "$APP_DIR/Frameworks/"

          # LIEF inject for arm64+arm64e fat binary
          python3 -c "
import lief
path = '$BIN'
TARGET = '@executable_path/Frameworks/Diditok.dylib'
print('[inject] parsing', path)
parsed = lief.MachO.parse(path)
if isinstance(parsed, lief.MachO.FatBinary):
    print('[inject] FatBinary', parsed.size, 'slices')
    for i in range(parsed.size):
        b = parsed.at(i)
        names = [l.name for l in b.libraries]
        if TARGET not in names:
            b.add_library(TARGET)
            print('  slice[' + str(i) + ']: added')
        else:
            print('  slice[' + str(i) + ']: present')
    parsed.write(path)
elif isinstance(parsed, lief.MachO.Binary):
    if TARGET not in [l.name for l in parsed.libraries]:
        parsed.add_library(TARGET)
    parsed.write(path)
print('[inject] done')
"

          # 清理旧签名
          rm -rf "$APP_DIR/_CodeSignature"
          find "$APP_DIR/Frameworks" -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true

          # 自签（带 runtime hardened）
          codesign --force --sign - --options runtime "$APP_DIR/Frameworks/Diditok.dylib"
          codesign --force --sign - --options runtime "$BIN"
          codesign --force --sign - --deep --options runtime "$APP_DIR"

          # 打包
          cd ipa_extracted
          zip -qr ../out/diditok-injected.ipa Payload
          cd ..
          ls -lh out/

          echo "=== 验证 ==="
          unzip -l out/diditok-injected.ipa | grep -i diditok || echo "❌ Diditok.dylib not in IPA!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: diditok-injected-ipa
          path: out/diditok-injected.ipa
          retention-days: 30
