name: Build Diditok Injection IPA

on:
  workflow_dispatch:
    inputs:
      original_ipa_url:
        description: "原始滴滴 IPA 下载直链"
        required: true
        default: ""

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 下载原始 IPA
        run: |
          curl -L -o original.ipa "${{ github.event.inputs.original_ipa_url }}"
          ls -lh original.ipa

      - name: 安装 Theos
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/theos/theos.git ~/theos || {
            git clone --depth 1 https://github.com/theos/theos.git ~/theos
            cd ~/theos && git submodule update --init --recursive
          }
          echo "THEOS installed"
          ls ~/theos/vendor/include/ 2>/dev/null | head -5 || echo "no vendor/include yet"
          ~/theos/bin/update-theos 2>/dev/null || echo "update-theos done"
          ls ~/theos/vendor/include/ | head -5
          ls ~/theos/vendor/lib/ | head -5
          brew install ldid 2>/dev/null || echo "ldid already installed"

      - name: 构建 Diditok.dylib
        run: |
          cd Tweak
          make clean THEOS="$HOME/theos" 2>/dev/null || true
          make all THEOS="$HOME/theos"
          echo "=== 编译产物 ==="
          find . -name "*.dylib" -type f
          ls -la .theos/obj/ 2>/dev/null || true

      - name: 收集 dylib
        run: |
          mkdir -p out
          DYLIB=$(find . -name "Diditok.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: Diditok.dylib not found"
            exit 1
          fi
          cp "$DYLIB" out/Diditok.dylib
          echo "Copied $DYLIB"
          ls -lh out/

      - name: 构建 insert_dylib
        run: |
          curl -L -o id.zip https://github.com/Tatsunori/insert_dylib/archive/refs/heads/master.zip
          unzip -q id.zip
          mv insert_dylib-master insert_dylib 2>/dev/null || true
          cd insert_dylib || cd insert_dylib-master
          xcodebuild -configuration Release build 2>&1 | tail -10
          ls -la build/Release/insert_dylib

      - name: 注入 + 自签 + 重打包
        run: |
          set -e
          unzip -q ../original.ipa -d ipa_extracted
          APP_DIR=$(find ipa_extracted/Payload -name "*.app" -type d | head -1)
          echo "App dir: $APP_DIR"
          BIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist")
          echo "Binary: $BIN_NAME"
          BIN_PATH="$APP_DIR/$BIN_NAME"
          cp out/Diditok.dylib "$APP_DIR/Frameworks/"
          ./insert_dylib/build/Release/insert_dylib \
            --inplace --strip-existing \
            "@executable_path/Frameworks/Diditok.dylib" \
            "$BIN_PATH"
          codesign --force --deep --sign - "$BIN_PATH"
          codesign --force --sign - "$APP_DIR/Frameworks/Diditok.dylib"
          codesign --force --deep --sign - "$APP_DIR"
          cd ipa_extracted && zip -qr ../diditok-injected.ipa Payload && cd ..
          ls -lh diditok-injected.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: diditok-injected-ipa
          path: diditok-injected.ipa
