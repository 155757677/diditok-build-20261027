name: Build Dongfeng Decoder IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 用哪台 macOS 构建机（排队时换一个）
        type: choice
        default: macos-26-intel
        options:
          - macos-26
          - macos-15
          - macos-26-intel
          - macos-15-intel

permissions:
  contents: read

jobs:
  ipa:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version | head -2
          sysctl -n machdep.cpu.brand_string || true

      - name: Install xcodegen
        run: |
          set -e
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Decoder self-test（先验证算法移植，再打包）
        run: |
          set -e
          swiftc -O dongfeng/Sources/DongfengDecoder.swift dongfeng/SelfTest/main.swift -o /tmp/dfselftest
          /tmp/dfselftest

      - name: Generate Xcode project
        run: |
          set -e
          cd dongfeng
          xcodegen generate
          xcodebuild -list -project DongfengDecoder.xcodeproj

      - name: Build (Release / iphoneos / arm64, 不签名)
        run: |
          set -e
          xcodebuild \
            -project dongfeng/DongfengDecoder.xcodeproj \
            -scheme DongfengDecoder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "APP=$APP"
          lipo -info "$APP/DongfengDecoder"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | sed -n '1,30p'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
          test -f "$APP/Assets.car" || { echo "缺 Assets.car，图标没编进去"; exit 1; }
          echo "Assets.car $(stat -f%z "$APP/Assets.car") 字节"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Payload
          cp -R "$APP" /tmp/pkg/Payload/
          codesign --remove-signature /tmp/pkg/Payload/*.app 2>/dev/null || true
          cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/DongfengDecoder.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/DongfengDecoder.ipa"
          unzip -l "$GITHUB_WORKSPACE/DongfengDecoder.ipa" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: dongfeng-decoder-ipa
          path: DongfengDecoder.ipa
          if-no-files-found: error
          retention-days: 90
