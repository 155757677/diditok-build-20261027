name: DongfengDecoder

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DongfengDecoder:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DongfengDecoder
        PRODUCT_BUNDLE_IDENTIFIER: com.df.dongfengdecoder
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_ON_THEFLIGHT_COPY: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  DongfengDecoder:
    build:
      targets:
        DongfengDecoder: all
