name: Build Diditok Injection IPA

on:
  workflow_dispatch:
    inputs:
      original_ipa_url:
        description: "原始滴滴 IPA 下载直链"
        required: true
        default: ""

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 下载原始 IPA
        run: |
          curl -fL --retry 3 -o original.ipa "${{ github.event.inputs.original_ipa_url }}"
          ls -lh original.ipa
          SZ=$(stat -f%z original.ipa)
          if [ "$SZ" -lt 50000000 ]; then
            echo "ERROR: original.ipa 只有 $SZ 字节，像是下载失败页"; head -c 200 original.ipa; exit 1
          fi

      - name: 构建 Diditok.dylib（clang 直接编译，不用 Theos / 不链接 substrate）
        run: |
          set -e
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun -sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -mios-version-min=13.4 \
            -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework Security -framework QuartzCore \
            -undefined dynamic_lookup \
            Tweak/MyTweak.m -o out/Diditok.dylib
          lipo -info out/Diditok.dylib
          ls -lh out/Diditok.dylib
          echo "=== 检查是否残留 substrate 符号（必须为空）==="
          if strings out/Diditok.dylib | grep -q "MSHookMessageEx"; then
            echo "ERROR: still depends on substrate"
            exit 1
          fi
          echo "OK: 无 substrate 依赖"
          echo "=== 依赖库 ==="
          otool -L out/Diditok.dylib

      - name: 注入 + 自签 + 重打包
        run: |
          set -e
          pip3 install lief --break-system-packages 2>/dev/null || pip install lief
          unzip -q original.ipa -d ipa_extracted
          APP_DIR=$(find ipa_extracted/Payload -maxdepth 2 -name "*.app" -type d | head -1)
          echo "App dir: $APP_DIR"
          BIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist")
          echo "Binary: $BIN_NAME"
          BIN_PATH="$APP_DIR/$BIN_NAME"

          # ── 版本伪装：宽松签侧载的包会被登录侧判「非官方或低版本」，
          #    低版本文案是本地 UnifyPassportService 的登录文案（当前App版本过低，请升级后重试）。
          #    把 CFBundleShortVersionString 抬到 App Store 最新版（2026-10-29 = 8.0.18）。
          #    只有当原始包版本 < APP_VERSION 时才替换，避免以后打 9.x 包时被降级。
          NEW_VER=8.0.18
          python3 - "$APP_DIR/Info.plist" "$NEW_VER" <<'PY'
          import sys, os, plistlib, time
          p, new = sys.argv[1], sys.argv[2]
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          def k(v):
              out = []
              for x in (v or '').split('.'):
                  out.append(int(x) if x.isdigit() else 0)
              return tuple(out)
          old = d.get('CFBundleShortVersionString') or ''
          if k(new) > k(old):
              b = d.get('CFBundleVersion') or ''
              tail = b.split('.')[-1] if '.' in b else str(int(time.time()))
              d['CFBundleShortVersionString'] = new
              d['CFBundleVersion'] = f'{new}.{tail}'
              with open(p, 'wb') as f:
                  plistlib.dump(d, f)
              print(f'[version] {old} / {b} -> {new} / {d["CFBundleVersion"]}')
          else:
              print(f'[version] keep {old} (>= {new})')
          PY

          # ⚠️ 关键：必须在 LIEF 改动前，把主二进制的原始 entitlements 备份出来。
          # 之前用 codesign --force --deep --sign - 重签把 entitlements 全部抹掉了
          # （keychain-access-groups / application-identifier / aps-environment 全没了），
          # 滴滴的 WSG 安全 SDK 拿不到这些就直接判定「非官方或低版本」。
          codesign -d --entitlements :- "$BIN_PATH" > ent.plist 2>/dev/null || true
          echo "=== 原始 entitlements ==="
          cat ent.plist || true
          if ! grep -q "application-identifier" ent.plist; then
            echo "ERROR: 原始包没有 entitlements，中止"
            exit 1
          fi

          mkdir -p "$APP_DIR/Frameworks"
          cp out/Diditok.dylib "$APP_DIR/Frameworks/"
          python3 inject.py "$BIN_PATH"

          # 新加的 dylib 不需要 entitlements
          codesign --force --sign - "$APP_DIR/Frameworks/Diditok.dylib"
          # 主二进制带着原始 entitlements 重签；不要用 --deep（会递归重签并清空嵌套项）
          codesign --force --sign - --entitlements ent.plist "$BIN_PATH"
          # 签整个 .app（不加 --deep，嵌套的框架保持它们原来的签名不动）
          codesign --force --sign - --entitlements ent.plist "$APP_DIR"

          echo "=== 重签后 entitlements 校验 ==="
          codesign -d --entitlements :- "$BIN_PATH" > after.plist 2>/dev/null || true
          if grep -q "keychain-access-groups" after.plist && grep -q "application-identifier" after.plist; then
            echo "OK: entitlements 完整保留"
          else
            echo "ERROR: entitlements 丢失"; cat after.plist; exit 1
          fi

          cd ipa_extracted && zip -qr ../diditok-injected.ipa Payload && cd ..
          ls -lh diditok-injected.ipa

      - name: 校验产物
        run: |
          unzip -l diditok-injected.ipa | grep -i Diditok || (echo "ERROR: dylib missing"; exit 1)
          rm -rf verify && unzip -q diditok-injected.ipa -d verify
          B=$(find verify/Payload -name OneTravel -type f -path "*/OneTravel.app/*" | head -1)
          echo "binary: $B"
          otool -L "$B" | grep -i Diditok || (echo "ERROR: load command missing"; exit 1)
          echo "OK: 已注入"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: diditok-injected-ipa
          path: diditok-injected.ipa
